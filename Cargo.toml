[workspace]
members = [
    "crates/tutor-rag",
    "crates/tutor-tools",
    "crates/tutor-agent",
    "crates/tutor-web",
    "src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.3.5"
license = "MIT"

[workspace.dependencies]
# Core/runtime crates (same rev from llm-harness-runtime)
llm-harness-agent = { git = "https://github.com/oh-my-harness/llm-harness-runtime.git", rev = "40c2984f2cbaead78944de4e1e493df8b47e4386", package = "llm-harness-agent" }
llm-harness-types = { git = "https://github.com/oh-my-harness/llm-harness-runtime.git", rev = "40c2984f2cbaead78944de4e1e493df8b47e4386", package = "llm-harness-types" }
llm-harness-loop  = { git = "https://github.com/oh-my-harness/llm-harness-runtime.git", rev = "40c2984f2cbaead78944de4e1e493df8b47e4386", package = "llm-harness-loop" }
llm-harness-runtime = { git = "https://github.com/oh-my-harness/llm-harness-runtime.git", rev = "40c2984f2cbaead78944de4e1e493df8b47e4386", package = "llm-harness-runtime" }
llm-harness-runtime-sandbox-os = { git = "https://github.com/oh-my-harness/llm-harness-runtime.git", rev = "40c2984f2cbaead78944de4e1e493df8b47e4386", package = "llm-harness-runtime-sandbox-os" }
llm-harness-runtime-audit-jsonl = { git = "https://github.com/oh-my-harness/llm-harness-runtime.git", rev = "40c2984f2cbaead78944de4e1e493df8b47e4386", package = "llm-harness-runtime-audit-jsonl" }
llm-harness-runtime-knowledge = { git = "https://github.com/oh-my-harness/llm-harness-runtime.git", rev = "40c2984f2cbaead78944de4e1e493df8b47e4386", package = "llm-harness-runtime-knowledge" }
llm-harness-runtime-memory = { git = "https://github.com/oh-my-harness/llm-harness-runtime.git", rev = "40c2984f2cbaead78944de4e1e493df8b47e4386", package = "llm-harness-runtime-memory" }
llm-harness-runtime-session-recall = { git = "https://github.com/oh-my-harness/llm-harness-runtime.git", rev = "40c2984f2cbaead78944de4e1e493df8b47e4386", package = "llm-harness-runtime-session-recall", features = ["sqlite"] }

# LLM provider adapter
llm_adapter = { git = "https://github.com/oh-my-harness/llm-api-adapter", rev = "193117cbb8398aadeca74a925cfd699617f8c861" }

# Common
anyhow      = "1"
async-trait = "0.1"
futures     = "0.3"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
tokio       = { version = "1", features = ["full"] }
tokio-util  = { version = "0.7", features = ["rt"] }
arrow-array = "58.3.0"
arrow-schema = "58.3.0"
lancedb = "0.30.0"
